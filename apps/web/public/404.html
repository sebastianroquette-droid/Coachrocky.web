<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <title>404 – Seite nicht gefunden | Coach Rocky</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFFFFF;
      color: #000000;
      font-family: Barlow, system-ui, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .t-display {
      margin: 0 0 20px;
      color: #000000;
      font-family: Figtree, system-ui, sans-serif;
      font-size: 48px;
      font-weight: 900;
      line-height: 1.1;
    }

    .text-body-lg {
      margin: 0 0 40px;
      color: rgba(0, 0, 0, 0.6);
      font-size: 18px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(100%, 360px);
    }

    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      border: 2px solid #3F72C3;
      border-radius: 8px;
      color: #000000;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 180ms ease-out, color 180ms ease-out;
    }

    .btn-primary {
      background: #3F72C3;
      color: #FFFFFF;
    }

    .btn-secondary {
      background: #FFFFFF;
    }

    .btn-primary:hover,
    .btn-secondary:hover {
      background: #D6E2F5;
      color: #000000;
    }

    .btn-primary:focus-visible,
    .btn-secondary:focus-visible {
      outline: 2px solid #3F72C3;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="t-display">404</h1>
    <p class="text-body-lg">Diese Seite existiert nicht.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Zurück zur Startseite</a>
      <a href="https://api.whatsapp.com/message/3ALP7UWP274PJ1?autoload=1&amp;app_absent=0" class="btn-secondary" target="_blank" rel="noopener noreferrer">Zum kostenlosen Beratungsgespräch</a>
    </div>
  </main>
</body>
</html>
